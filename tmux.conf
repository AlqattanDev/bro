# Bro session — you work full screen. Grok is hidden backend.
# Overlay shows clean content only (not the chat).

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g status-position bottom
set -g status-style 'bg=#1a1a1a,fg=#aaaaaa'
set -g status-left '#[fg=#7dcea0] bro '
set -g status-left-length 16
set -g status-right-length 40
set -g status-interval 1
set -g status-right '#(cat /Users/ali/.bro/status-line 2>/dev/null || echo ready)  #[fg=#666666]%H:%M '
# One work window. Hide the backend window from the bar.
set -g window-status-format '#{?#{==:#{window_name},me},,#[fg=#666666]#W }'
set -g window-status-current-format '#{?#{==:#{window_name},me},,}'
set -g window-status-separator ''
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#7dcea0'
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color:RGB'
set -g set-clipboard on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off

# Stay on work window. Never force the user into the Grok backend window.
# F1 = toggle the floating answer panel (BroBar's, not a tmux popup — it shows
#      over every app and never takes focus, so no popup_width conditional)
# F2 = escape: close panel and any board popup, stay on work (not advertised)
# F3 = screenshot the whole screen into the watch folder (manual only)
bind-key -n F1 run-shell '/Users/ali/.bro/bin/bro-show --toggle'
bind-key -n F2 run-shell '/Users/ali/.bro/bin/bro-show --close' \; display-popup -C \; select-window -t :you
bind-key -n F3 run-shell '/Users/ali/.bro/bin/bro-snapshot --screen'
bind-key -n F4 run-shell '/Users/ali/.bro/bin/bro-talk'

# Prefix fallbacks
bind o select-window -t :you
bind u run-shell '/Users/ali/.bro/bin/bro-show --open'
bind b run-shell '/Users/ali/.bro/bin/bro-show --board'
bind r run-shell '/Users/ali/.bro/bin/bro-snapshot'
bind R source-file /Users/ali/.bro/tmux.conf \; display-message 'bro config reloaded'

# Do NOT bind easy keys to the hidden "me" (Grok) window.
# Escape hatch if you really need the backend: Ctrl-a then g
bind g select-window -t :me
